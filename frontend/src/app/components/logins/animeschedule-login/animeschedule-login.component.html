<div class="row">
  <div class="col-5">AnimeSchedule</div>
  <div class="col-7">
    @if (animescheduleLoggedIn) {
      <myanili-icon-animeschedule class="me-1"></myanili-icon-animeschedule>
      <a
        href="https://animeschedule.net/users/{{ animescheduleLoggedIn.username }}"
        target="_blank"
        >{{ animescheduleLoggedIn.username }}</a
      >
      <myanili-icon
        class="cursor-pointer"
        name="x"
        size="20"
        (click)="animescheduleLogoff()"
      ></myanili-icon>
    } @else {
      <button
        class="btn btn-sm btn-primary"
        (click)="animescheduleConnect()"
        [disabled]="animescheduleLoading"
      >
        @if (animescheduleLoading) {
          <myanili-icon-loading></myanili-icon-loading>
        } @else {
          <myanili-icon-animeschedule></myanili-icon-animeschedule>
        }
        Connect
      </button>
    }
  </div>
</div>
