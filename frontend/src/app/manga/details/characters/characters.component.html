<div class="grid my-2">
  @for (character of characters; track character) {
    <myanili-media-card
      [poster]="character.character.image"
      [title]="character.character.name"
      [icon]="character.role === 'MAIN' ? 'star-fill' : undefined"
      [routerLink]="'/character/' + character.character.id"
    ></myanili-media-card>
  }
</div>
