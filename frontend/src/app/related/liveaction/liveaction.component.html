@if (related_liveaction.length) {
  <div class="mb-3">
    <strong class="text-dark">Live Action</strong>
    <div class="grid my-2">
      @for (entry of related_liveaction; track entry) {
        <myanili-media-card
          [poster]="entry.poster"
          [title]="entry.title"
          [mediaType]="entry.mediaType"
          (click)="open(entry)"
        >
          @if (entry.year) {
            <div class="small">{{ entry.year }}</div>
          }
        </myanili-media-card>
      }
    </div>
  </div>
}
