@if (actors.length) {
  <div class="grid grid-2x">
    @for (actor of actors; track actor) {
      <myanili-double-card
        [left]="{
          poster: actor.actor.image,
          title: actor.actor.name,
          subtitle: actor.language,
          link: '/person/' + actor.actor.id,
        }"
      ></myanili-double-card>
    }
  </div>
}
