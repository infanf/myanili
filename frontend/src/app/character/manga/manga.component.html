@if (roles.length) {
  <div class="grid my-2">
    @for (role of roles; track role) {
      <myanili-media-card
        [poster]="role.media.image"
        [title]="role.media.title"
        routerLink="/manga/details/{{ role.media.idMal }}"
        [icon]="role.role === 'MAIN' ? 'star-fill' : undefined"
        [attr.title]="role.role"
      ></myanili-media-card>
    }
  </div>
}
