@if (mangas.length) {
  <div class="grid grid-2x">
    @for (manga of mangas; track manga) {
      <myanili-double-card
        [left]="{
          poster: manga.media.image,
          title: manga.media.title,
          subtitle: manga.role,
          link: '/manga/details/' + manga.media.idMal,
        }"
      ></myanili-double-card>
    }
  </div>
}
