<div class="grid grid-2x">
  @for (role of animes; track role) {
    <myanili-double-card
      [left]="{
        poster: role.character.image,
        title: role.character.name,
        subtitle: role.role,
        link: '/character/' + role.character.id,
      }"
      [right]="{
        poster: role.media.image,
        title: role.media.title,
        link: '/anime/details/' + role.media.idMal,
      }"
    ></myanili-double-card>
  }
</div>
