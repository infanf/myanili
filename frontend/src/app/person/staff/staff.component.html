<div class="grid grid-2x">
  @for (anime of credits; track anime) {
    <myanili-double-card
      [left]="{
        poster: anime.media.image,
        title: anime.media.title,
        subtitle: anime.role,
        link: '/anime/details/' + anime.media.idMal,
      }"
    ></myanili-double-card>
  }
</div>
